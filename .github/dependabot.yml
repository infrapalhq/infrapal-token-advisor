version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Runtime packages are bundled into the shipped dashboard; keep them
      # in their own PR so they get a closer look.
      web-runtime:
        dependency-type: production
        patterns: ["*"]
      web-dev:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
