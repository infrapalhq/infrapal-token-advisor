name: codeql

# Uses advanced setup: keep the repository's CodeQL "default setup" off, or
# the two configurations conflict.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The built dashboard is minified output of web/src, which is
          # scanned directly.
          config: |
            paths-ignore:
              - internal/webui/dist
      - name: Build Go for extraction
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
