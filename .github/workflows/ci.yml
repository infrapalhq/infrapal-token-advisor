name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / fmt, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # prove this workflow's identity to Codecov, instead of a stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      # Coverage counts every package the tests run, since some code, such as
      # the adapter contract, is only exercised from other packages' tests.
      - name: go test
        run: |
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          {
            echo '### Test coverage'
            echo
            echo "${total}% of statements, and at least ${MIN_COVERAGE}% is required."
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v min="$MIN_COVERAGE" 'BEGIN { exit !(t < min) }'; then
            echo "::error::Test coverage is ${total}%, below the required ${MIN_COVERAGE}%. Add tests for the new code."
            exit 1
          fi
        env:
          MIN_COVERAGE: "80"
      # Publishes the coverage report for the README badge and pull request
      # comments. Only this repository's own runs can upload: a fork's pull
      # request has no identity token. The 80% gate above is what blocks a merge.
      - name: upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          disable_search: true
          fail_ci_if_error: false

  lint:
    name: go / golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  web:
    name: web / lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # build-web.sh runs npm ci + the tsc/vite build and copies the output
      # into internal/webui/dist, which the Go binary embeds.
      - run: scripts/build-web.sh
      - run: npm --prefix web run lint

  release-snapshot:
    name: release / goreleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The goreleaser before-hook runs scripts/build-web.sh.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          # Signing needs the release workflow's identity, which a PR doesn't have.
          args: release --snapshot --clean --skip=sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 1

  clean-machine:
    name: install / ${{ matrix.os }}
    needs: release-snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: snapshot
          path: snapshot
      - name: Install from the snapshot with scripts/install.sh
        run: |
          version=$(ls snapshot/*.tar.gz | head -1 | sed -E 's/.*advisor_(.*)_(darwin|linux)_.*/\1/')
          TOKEN_ADVISOR_VERSION=$version \
            TOKEN_ADVISOR_BASE_URL=file://$PWD/snapshot \
            sh scripts/install.sh
      - name: Run the installed binary on a machine with nothing set up
        run: |
          export PATH=$HOME/.local/bin:$PATH
          token-advisor version
          token-advisor start &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:4319/
          curl -fsS http://127.0.0.1:4319/ | grep -q 'id="root"'
          token-advisor status
          token-advisor logs --errors
