name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / fmt, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: web / lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # build-web.sh runs npm ci + the tsc/vite build and copies the output
      # into internal/webui/dist, which the Go binary embeds.
      - run: scripts/build-web.sh
      - run: npm --prefix web run lint

  release-snapshot:
    name: release / goreleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The goreleaser before-hook runs scripts/build-web.sh.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 1

  clean-machine:
    name: install / ${{ matrix.os }}
    needs: release-snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: snapshot
          path: snapshot
      - name: Install from the snapshot with scripts/install.sh
        run: |
          version=$(ls snapshot/*.tar.gz | head -1 | sed -E 's/.*advisor_(.*)_(darwin|linux)_.*/\1/')
          TOKEN_ADVISOR_VERSION=$version \
            TOKEN_ADVISOR_BASE_URL=file://$PWD/snapshot \
            sh scripts/install.sh
      - name: Run the installed binary on a machine with nothing set up
        run: |
          export PATH=$HOME/.local/bin:$PATH
          token-advisor version
          token-advisor start &
          sleep 3
          curl -fsS -o /dev/null http://127.0.0.1:4319/
          curl -fsS http://127.0.0.1:4319/ | grep -q 'id="root"'
          token-advisor status
          token-advisor logs --errors
