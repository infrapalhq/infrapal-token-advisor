name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / fmt, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...

  web:
    name: web / lint, build, dist in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # build-web.sh runs npm ci + the tsc/vite build and copies the output
      # into internal/webui/dist, which the Go binary embeds.
      - run: scripts/build-web.sh
      - run: npm --prefix web run lint
      - name: internal/webui/dist matches web/ source
        run: |
          if [ -n "$(git status --porcelain -- internal/webui/dist)" ]; then
            git status --short -- internal/webui/dist
            echo "internal/webui/dist is stale: run scripts/build-web.sh and commit the result."
            exit 1
          fi

  release-snapshot:
    name: release / goreleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The goreleaser before-hook runs scripts/build-web.sh.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
