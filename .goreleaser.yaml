version: 2

project_name: infrapal-token-advisor

before:
  hooks:
    - go mod tidy
    - ./scripts/build-web.sh

builds:
  - id: infrapal-token-advisor
    main: ./cmd/token-advisor
    binary: token-advisor
    # modernc.org/sqlite is pure Go, so CGO stays off — one static binary
    # per platform, no libsqlite3 to link against on the build or install
    # machine.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Reproducible: the same commit builds the same bytes anywhere. -trimpath
    # keeps the build machine's paths out of the binary, and the commit's own
    # time stands in for the time of the build.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/infrapalhq/infrapal-token-advisor/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: infrapal-token-advisor
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # The MIT license requires its notice to go with every copy.
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
    # A fixed owner too, or each archive records whoever ran the build.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"

# Linux packages: .deb for Debian and Ubuntu, .rpm for Fedora and RHEL, and
# .pkg.tar.zst for Arch. Each installs /usr/bin/token-advisor. They are listed
# in checksums.txt, so the signature on it covers them too.
nfpms:
  - id: packages
    package_name: infrapal-token-advisor
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Infrapal
    homepage: "https://github.com/infrapalhq/infrapal-token-advisor"
    maintainer: "Infrapal <hello@infrapal.io>"
    description: "See where your Claude Code tokens go, and what to change. Local collector, SQLite store and dashboard."
    license: MIT
    section: utils
    formats: [deb, rpm, archlinux]
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/infrapal-token-advisor/LICENSE
        file_info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/infrapal-token-advisor/README.md
        file_info:
          mtime: "{{ .CommitDate }}"
    archlinux:
      packager: "Infrapal <hello@infrapal.io>"

checksum:
  name_template: "checksums.txt"

# Sign the checksums with Sigstore's keyless signing. The certificate names this
# repository's release workflow, so there's no key to keep or lose, and one
# signature covers every archive, since each one's hash is in checksums.txt.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publishing to the Homebrew tap and the AUR each needs a secret. Without it,
# that step is skipped and the rest of the release still goes out.
homebrew_casks:
  - name: infrapal-token-advisor
    binaries:
      - token-advisor
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    repository:
      owner: infrapalhq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/infrapalhq/infrapal-token-advisor"
    description: "See where your Claude Code tokens go, and what to change"
    caveats: |
      Run `token-advisor init` to start collecting.
      After upgrading, run `token-advisor restart`.
    hooks:
      post:
        # The binary isn't signed yet, and macOS refuses to run a quarantined
        # unsigned download.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/token-advisor"]
          end

# The AUR package, so Arch users can install with an AUR helper such as yay.
# AUR_KEY is the private SSH key of the AUR account that maintains it.
aurs:
  - name: infrapal-token-advisor-bin
    homepage: "https://github.com/infrapalhq/infrapal-token-advisor"
    description: "See where your Claude Code tokens go, and what to change"
    maintainers:
      - "Infrapal <hello@infrapal.io>"
    license: MIT
    provides: [infrapal-token-advisor]
    conflicts: [infrapal-token-advisor]
    skip_upload: '{{ if index .Env "AUR_KEY" }}false{{ else }}true{{ end }}'
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/infrapal-token-advisor-bin.git"
    commit_author:
      name: Infrapal
      email: hello@infrapal.io
    package: |-
      install -Dm755 "./token-advisor" "${pkgdir}/usr/bin/token-advisor"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/infrapal-token-advisor/LICENSE"
