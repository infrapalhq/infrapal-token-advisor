version: 2

project_name: infrapal-token-advisor

before:
  hooks:
    - go mod tidy
    - ./scripts/build-web.sh

builds:
  - id: infrapal-token-advisor
    main: ./cmd/token-advisor
    binary: token-advisor
    # modernc.org/sqlite is pure Go, so CGO stays off — one static binary
    # per platform, no libsqlite3 to link against on the build or install
    # machine.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/infrapalhq/infrapal-token-advisor/internal/cli.Version={{.Version}}

archives:
  - id: infrapal-token-advisor
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: infrapal-token-advisor
    binaries:
      - token-advisor
    repository:
      owner: infrapalhq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/infrapalhq/infrapal-token-advisor"
    description: "Local-only OTLP receiver, SQLite store, and dashboard for Claude Code telemetry"
    caveats: |
      Run `token-advisor init` to start collecting.
      After upgrading, run `token-advisor restart`.
    hooks:
      post:
        # The binary isn't signed yet, and macOS refuses to run a quarantined
        # unsigned download.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/token-advisor"]
          end
