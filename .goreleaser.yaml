version: 2

project_name: infrapal-token-advisor

before:
  hooks:
    - go mod tidy
    - ./scripts/build-web.sh

builds:
  - id: infrapal-token-advisor
    main: ./cmd/infrapal-token-advisor
    binary: infrapal-token-advisor
    # modernc.org/sqlite is pure Go, so CGO stays off — one static binary
    # per platform, no libsqlite3 to link against on the build or install
    # machine.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/infrapalhq/infrapal-token-advisor/internal/cli.Version={{.Version}}

archives:
  - id: infrapal-token-advisor
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: infrapal-token-advisor
    repository:
      owner: infrapalhq
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/infrapalhq/infrapal-token-advisor"
    description: "Local-only OTLP receiver, SQLite store, and dashboard for Claude Code telemetry"
    license: "MIT"
    install: |
      bin.install "infrapal-token-advisor"
    test: |
      assert_match "infrapal-token-advisor", shell_output("#{bin}/infrapal-token-advisor version")
